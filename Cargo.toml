[package]
name = "rusty_quartermaster"
version = "0.1.0"
edition = "2024"
authors = ["F5XS"]
description = "Unofficial fan tool for Puzzle Pirates: parses the game chat log to track voyages, battles, and crew stats."
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
serde_json = "1"
strsim = "0.11"
ratatui = "0.30.1"
reqwest = { version = "0.13.4", features = ["json"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }

[build-dependencies]
serde_json = "1"
