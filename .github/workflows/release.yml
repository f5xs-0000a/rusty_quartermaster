name: Release

# Fully automated releases via release-please:
#   1. Every push to the main branch, release-please maintains a "Release PR"
#      that bumps the version in Cargo.toml (+ Cargo.lock) and updates
#      CHANGELOG.md from the Conventional-Commit history (feat:/fix:/…).
#   2. Merging that PR cuts a GitHub Release + tag.
#   3. Only then does the build matrix run, compiling the Windows .exe and Linux
#      binary and uploading them to the just-created release.
#
# The build is gated on `release_created` because a tag pushed by the Actions
# bot does NOT trigger a separate `on: push: tags` workflow — so the binaries
# must be built in the same run that creates the release.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write # create the release + tag, upload assets
  pull-requests: write # open/update the Release PR

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: rusty_quartermaster

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build (${{ matrix.target }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Stage the binary under a per-target name so the two artifacts don't
      # collide as release assets.
      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.ext }}" \
             "dist/${BIN_NAME}-${{ matrix.target }}${{ matrix.ext }}"

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${env:BIN_NAME}${{ matrix.ext }}" `
                    "dist/${env:BIN_NAME}-${{ matrix.target }}${{ matrix.ext }}"

      # Attach the binary to the release release-please just created. The
      # explicit path (built from matrix values, substituted before the shell
      # runs) keeps this one command identical on bash and pwsh.
      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "dist/${{ env.BIN_NAME }}-${{ matrix.target }}${{ matrix.ext }}" --clobber
